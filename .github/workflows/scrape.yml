name: Daily Afisha Scrape

on:
  schedule:
    - cron: '0 5 * * *' # Запуск каждый день в 05:00 UTC (08:00 по Москве)
  workflow_dispatch: # Позволяет запустить вручную для теста

permissions:
  contents: write # Разрешение на сохранение изменений в репозиторий

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python afisha.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add afisha.json
          git diff --staged --quiet || git commit -m "Update afisha data"
          git push
